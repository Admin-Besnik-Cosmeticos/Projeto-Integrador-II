@if (aberto()) {
  <div class="modal__overlay" (click)="aoClicarOverlay($event)">
    <div
      #janela
      class="modal__janela"
      role="dialog"
      aria-modal="true"
      [attr.aria-labelledby]="idTitulo"
      [attr.aria-busy]="carregando() ? 'true' : null"
      tabindex="-1"
    >
      <header class="modal__cabecalho">
        <h2 class="modal__titulo" [id]="idTitulo">{{ titulo() }}</h2>
        <button
          class="modal__fechar"
          type="button"
          aria-label="Fechar modal"
          title="Fechar modal"
          [disabled]="carregando()"
          (click)="solicitarFechamento()"
        >
          <svg
            aria-hidden="true"
            viewBox="0 0 24 24"
            width="24"
            height="24"
            fill="none"
            stroke="currentColor"
            stroke-width="1.6"
            stroke-linecap="round"
            stroke-linejoin="round"
          >
            <circle cx="12" cy="12" r="9.75" />
            <path d="M9.2 9.2l5.6 5.6" />
            <path d="M14.8 9.2l-5.6 5.6" />
          </svg>
        </button>
      </header>

      <div class="modal__corpo">
        <ng-content />
      </div>

      <footer class="modal__rodape" [class.modal__rodape--visivel]="possuiAcoes()">
        <ng-content select="[modalAcoes]" />
      </footer>
    </div>
  </div>
}
