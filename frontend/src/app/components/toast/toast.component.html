@if (toasts().length > 0) {
  <div class="toast" role="region" aria-label="Notificações">
    @for (toast of toasts(); track toast.id) {
      <div
        class="toast__item"
        [class.toast__item--erro]="toast.tipo === 'erro'"
        [attr.role]="toast.tipo === 'erro' ? 'alert' : 'status'"
        aria-atomic="true"
      >
        <span class="toast__icone" aria-hidden="true">
          @if (toast.tipo === 'erro') {
            <svg
              viewBox="0 0 24 24"
              width="18"
              height="18"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
            >
              <circle cx="12" cy="12" r="9" />
              <path d="M12 8v4" />
              <path d="M12 16h.01" />
            </svg>
          } @else {
            <svg
              viewBox="0 0 24 24"
              width="18"
              height="18"
              fill="none"
              stroke="currentColor"
              stroke-width="2.4"
              stroke-linecap="round"
              stroke-linejoin="round"
            >
              <path d="m5 13 4 4L19 7" />
            </svg>
          }
        </span>

        <p class="toast__mensagem">{{ toast.mensagem }}</p>

        <button
          class="toast__fechar"
          type="button"
          aria-label="Fechar notificação"
          (click)="fechar(toast.id)"
        >
          <svg
            aria-hidden="true"
            viewBox="0 0 24 24"
            width="14"
            height="14"
            fill="none"
            stroke="currentColor"
            stroke-width="2.2"
            stroke-linecap="round"
          >
            <path d="M18 6 6 18" />
            <path d="m6 6 12 12" />
          </svg>
        </button>

        <span class="toast__tempo" aria-hidden="true"></span>
      </div>
    }
  </div>
}
